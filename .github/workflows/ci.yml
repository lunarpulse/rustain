name: CI

# `gate/**` is the pre-merge gate: the integrator pushes a candidate SHA to
# gate/<row> and lands it when every job is green (a re-run pushes the same SHA
# to gate/<row>-r2). `main` stays: a tag needs a green run on its own commit.
on:
  push:
    branches: [main, "gate/**"]
  pull_request:
    branches: [main]

# A newer push to the same gate branch or pull request cancels the older run.
# Each `main` run gets its own group (run_id), so a `main` run is never queued
# behind, superseded by or cancelled for another one.
concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

# Every Swatinem/rust-cache step saves only on `main`. The repository cache sits
# at its 10 GB limit with the `main` caches alone, so caches saved from gate or
# pull-request refs (usable by no other branch) would evict them; those runs
# still restore the `main` caches.
jobs:
  lint:
    name: Lint (fmt, clippy, script controls)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Toolchain is pinned by rust-toolchain.toml (Grand Plan P0-5); the action ref
      # matches it so the runner installs exactly one toolchain. Bump both together.
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: rui314/setup-mold@v1
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Format
        run: cargo fmt --check

      - name: Event loop invariant check
        run: |
          if grep -nP '^\s*let\s+\w+\s*=\s*rx\.await' src/infrastructure/runtime/event_loop.rs; then
              echo "ERROR: rx.await inside event_loop.rs — see module invariant docs"
              exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned source-metric parser and TUI control dependencies
        run: |
          python3 -m pip install -r tools/ci/requirements-metrics.txt
          python3 -m pip install -e "./tests_tui[dev]"

      - name: Run metric, ratchet signoff and TUI contract behavioral controls
        run: |
          python3 - <<'PY'
          import sys
          import unittest
          suites = []
          for pattern in (
              "test_event_loop_complexity.py",
              "test_ratchet_signoff_guard.py",
              "test_check_tui_skips.py",
              "test_run_nightly_tui.py",
              "test_carried_j10_receipts.py",
              "test_named_capture_geometry.py",
          ):
              suite = unittest.defaultTestLoader.discover(".github/scripts", pattern=pattern)
              if suite.countTestCases() == 0:
                  raise SystemExit(f"No behavioral controls selected: {pattern}")
              suites.append(suite)
          result = unittest.TextTestRunner(verbosity=2).run(unittest.TestSuite(suites))
          sys.exit(0 if result.wasSuccessful() else 1)
          PY

      # Clippy is BLOCKING again (Grand Plan P0-5). It was advisory while
      # rust-toolchain.toml floated on `stable` and the runner's lint set drifted
      # from local; the exact pin removes that drift. vector-search clippy lives in
      # nightly-vector-search.yml (its ort/fastembed build pulls network).
      - name: Clippy (default)
        run: cargo clippy --all-targets -- -D warnings

      - name: Clippy (telegram+cron)
        run: cargo clippy --all-targets --features "telegram cron" -- -D warnings

      - name: Clippy (a2a)
        run: cargo clippy --all-targets --features a2a -- -D warnings

      - name: Clippy (p2p)
        run: cargo clippy --all-targets --features p2p -- -D warnings

  test:
    name: Test (default suite + test-instrumentation)
    runs-on: ubuntu-latest
    steps:
      # Full history: the baseline-integrity tests in tests/conformance.rs run
      # `git show <SHA>:<path>` against pinned commits.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: rui314/setup-mold@v1
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # The suite executes tests/conformance.rs, including its fail-closed metric
      # and authentication-boundary checker.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned source-metric parser
        run: python3 -m pip install -r tools/ci/requirements-metrics.txt

      # The whole default suite, not an enumeration (Grand Plan P0-3/P0-5). Integration
      # tests are area binaries (tests/<area>/main.rs, Cargo.toml [[test]]); the lib
      # guards `every_integration_test_root_is_owned_by_one_area_binary` and
      # `every_integration_test_root_runs_in_a_ci_lane_with_its_features`
      # (src/domain/ports/capability_provider.rs) fail this job if a root is
      # unowned or if no invocation below enables the features a gated root needs.
      - name: Test
        run: |
          set -o pipefail
          cargo test --all-targets --no-fail-fast 2>&1 | tee test-output.log
          # Roots gated on `test-instrumentation` alone (the CLI config/session
          # targets in `cli`, the standalone approval/response-mode keystones in
          # `a2a`) compile out of the default build; run those binaries with the
          # feature on and nothing else, so the keystones execute without `a2a`.
          cargo test --features test-instrumentation --test cli --test a2a 2>&1 | tee -a test-output.log
      - name: Annotate test failures
        if: failure()
        run: python3 .github/scripts/annotate-test-failures.py test-output.log

  skills-validation:
    name: Skills Validation Feature
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: rui314/setup-mold@v1
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Test with skills-validation feature (lib only)
        run: cargo test --lib --features skills-validation

  telegram-cron:
    name: Telegram + Cron Features
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: rui314/setup-mold@v1
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Run Telegram and cron tests
        run: |
          set -o pipefail
          cargo test --locked --features telegram,cron --lib --test daemon --test profile --no-fail-fast 2>&1 | tee test-output.log
      - name: Annotate test failures
        if: failure()
        run: python3 .github/scripts/annotate-test-failures.py test-output.log

  a2a:
    name: A2A Feature
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: rui314/setup-mold@v1
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # This lane executes tests/conformance.rs, including its fail-closed metric.
      - name: Install pinned source-metric parser
        run: python3 -m pip install -r tools/ci/requirements-metrics.txt

      # Story 17.4b standing ruling: every A2A integration test must EXECUTE in CI,
      # not merely compile. Since Grand Plan P0-3 the a2a-gated roots live in the
      # `a2a` area binary (tests/a2a/main.rs) and the whole suite runs here under the
      # feature; the lib guard `every_integration_test_root_runs_in_a_ci_lane_with_its_features`
      # fails the DEFAULT lane if a gated root has no invocation that enables it.
      #
      # `test-instrumentation` is REQUIRED, not incidental: AC2b's zero-mutation
      # ratchet and AC7b's card-signing counter are both cfg'd behind it, and without
      # it those keystones would silently degrade to their behavioural halves. Pinned
      # by `the_ci_a2a_lane_enables_the_zero_mutation_ratchet`.
      - name: Test with a2a feature (lib + whole suite)
        run: |
          set -o pipefail
          cargo test --features a2a,test-instrumentation --all-targets --no-fail-fast 2>&1 | tee test-output.log
      - name: Annotate test failures
        if: failure()
        run: python3 .github/scripts/annotate-test-failures.py test-output.log

      - name: Execute the real cron proposal front-door consumers
        run: |
          set -o pipefail
          cargo test --locked --features a2a,test-instrumentation,cron \
            --test a2a -- --exact \
            conformance_19_21_a2a_distribution::g_entrypoints::cron_scheduler_job_denies_proposal_with_trusted_writer \
            conformance_19_21_a2a_distribution::g_k06_payload::interleaved_cron_keeps_attached_proposal_on_invoking_conversation \
            | tee cron-proposal-results.txt
          python3 - <<'PY'
          import pathlib, re
          text = pathlib.Path("cron-proposal-results.txt").read_text()
          names = [
              "conformance_19_21_a2a_distribution::g_entrypoints::cron_scheduler_job_denies_proposal_with_trusted_writer",
              "conformance_19_21_a2a_distribution::g_k06_payload::interleaved_cron_keeps_attached_proposal_on_invoking_conversation",
          ]
          assert re.search(r"^running 2 tests$", text, re.M), "Cron proposal consumers selected zero/wrong tests"
          for name in names:
              assert re.search(r"^test " + re.escape(name) + r" \.\.\. ok$", text, re.M), text
          assert re.search(r"^test result: ok\. 2 passed; 0 failed; 0 ignored;", text, re.M), text
          PY
      - name: Retain named cron proposal caller result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: story-19-21g-cron
          path: cron-proposal-results.txt

  p2p:
    name: P2P Feature
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: rui314/setup-mold@v1
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The whole-suite run includes the `core` binary's fail-closed complexity metric.
      - name: Install pinned source-metric parser
        run: python3 -m pip install -r tools/ci/requirements-metrics.txt

      # Run only bans: aggregate `cargo deny check` is intentionally excluded because this
      # repository has no `[licenses]` allowlist and its baseline `lru 0.16.3` advisory makes
      # that broader check red for reasons outside this story.
      - name: Dependency bans (p2p)
        run: |
          cargo install --locked cargo-deny
          cargo deny check bans

      # The default test job never enables this non-default transport feature.
      # The p2p-gated roots live in the `p2p` area binary (tests/p2p/main.rs); the
      # relay targets additionally need `p2p-test-utils` (hermetic relay fixture,
      # `bind_without_direct_paths` — `debug_assertions`-gated, so this stays a
      # debug-profile run) and the relay-server target needs `relay-server`. One
      # invocation with the union runs them all; the lib guard
      # `every_integration_test_root_runs_in_a_ci_lane_with_its_features` checks it.
      - name: Test with p2p feature (lib + whole suite)
        run: |
          set -o pipefail
          cargo test --lib --features p2p 2>&1 | tee test-output.log
          cargo test --features p2p,p2p-test-utils,relay-server --all-targets --no-fail-fast 2>&1 | tee -a test-output.log
      - name: Annotate test failures
        if: failure()
        run: python3 .github/scripts/annotate-test-failures.py test-output.log
  mcp:
    name: MCP Feature
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: rui314/setup-mold@v1
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The whole-suite run includes the `core` binary's fail-closed complexity metric.
      - name: Install pinned source-metric parser
        run: python3 -m pip install -r tools/ci/requirements-metrics.txt

      # Story 17.5a: MCP integration targets must execute, not merely compile.
      # MCP itself is a default feature, so the test job's whole-suite run already
      # covers the surface WITHOUT the fake server; this lane adds `test-fake-mcp`,
      # which turns on the fake-server-backed roots in the `mcp` area binary
      # (tests/mcp/main.rs) and the fake-backed cases in `cli`/`orchestration`.
      # A true MCP-off build (`--no-default-features`) is pre-existing broken by
      # DF-17-4a-6: runtime, startup and ACP reference MCP-gated adapters.
      - name: Test with the fake MCP server (lib + whole suite)
        run: |
          set -o pipefail
          cargo test --features test-fake-mcp --all-targets --no-fail-fast 2>&1 | tee test-output.log
      - name: Annotate test failures
        if: failure()
        run: python3 .github/scripts/annotate-test-failures.py test-output.log

  vector-search:
    name: Heavy Feature Lanes (vector-search, wasm-sandbox)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: rui314/setup-mold@v1
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Compiles fastembed/ort + reqwest + bm25 and runs the vector-search lib
      # tests plus the `memory` area binary, which owns tests/vector_search.rs
      # and tests/regression_removal_integrity.rs (mockito-based, no real
      # network). The #[ignore] real-model / network tests do NOT run here —
      # they are exercised by the nightly-vector-search workflow.
      - name: Test with vector-search feature
        run: cargo test --features vector-search --test memory

      # tests/wasm_execution_sandbox.rs (module of `orchestration`) is gated on
      # `wasm-sandbox` and, until Grand Plan P0-3, ran in no workflow at all — a
      # false green the lib guard now refuses. wasmtime is heavy, so it rides this
      # already-heavy lane rather than the test job.
      - name: Test with wasm-sandbox feature
        run: "cargo test --features wasm-sandbox --test orchestration wasm_execution_sandbox::"
  macos-unit:
    name: macOS Unit Tests (daemon/ProcInspector)
    runs-on: macos-latest
    # The lib test binary compiled for the two daemon filters doubled with the
    # epic-20 auth series (5:09 -> 10:47 warm, over 15 min cold), so 15 minutes
    # cancelled the job on cold or busy runners.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Detect daemon-related path changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            daemon-paths:
              - 'src/adapters/daemon/**'
              - 'src/infrastructure/paths.rs'
              - 'dist/**'
              - 'tests/daemon_*'
              - '.github/workflows/ci.yml'
              - '.github/workflows/nightly-daemon.yml'

      - name: Run macOS daemon lib tests
        if: steps.filter.outputs.daemon-paths == 'true' || github.event_name == 'push'
        run: |
          cargo test --features telegram,cron --lib adapters::daemon::pidfile
          cargo test --features telegram,cron --lib adapters::daemon::procargs

      # tests/daemon_crash_recovery.rs is a module of the `daemon` area binary;
      # the filter keeps this job to that module's non-ignored tests.
      - name: Run macOS daemon integration tests (non-ignored)
        if: steps.filter.outputs.daemon-paths == 'true' || github.event_name == 'push'
        run: "cargo test --test daemon daemon_crash_recovery::"
  install-script-macos:
    name: Install script (macOS shells)
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # The rel-4 harness with stubbed downloads, under macOS's /bin/sh and zsh and
      # its BSD tools; Linux shells run it from `cargo test` (tests/install_script.rs).
      - name: Install script harness (/bin/sh, zsh)
        run: |
          sh tests/install_script/harness.sh
          INSTALL_SH=zsh sh tests/install_script/harness.sh
  tui-tests:
    name: Python TUI Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: rui314/setup-mold@v1
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build rustain binary
        run: cargo build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Python TUI test dependencies
        run: pip install -e "./tests_tui[dev]"

      - name: Execute canonical receipt policy controls without reruns
        env:
          RUSTAIN_RECEIPT_EVIDENCE_DIR: ${{ github.workspace }}/receipt-checker-evidence
        run: |
          pytest tests_tui/test_receipt_controls.py -m "not a2a_binary" \
            -p no:rerunfailures -n 0 --timeout=120 --junitxml=receipt-policy-results.xml -v
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          cases = ET.parse("receipt-policy-results.xml").findall(".//testcase")
          assert len(cases) == 29 and len({case.attrib["name"] for case in cases}) == 29, cases
          assert all(case.find(tag) is None for case in cases for tag in ("skipped", "failure", "error")), "A required receipt policy control skipped/failed/errored"
          PY
      - name: Retain allowlisted receipt policy diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: receipt-policy-controls
          path: |
            receipt-policy-results.xml
            receipt-checker-evidence/**/positive.json
            receipt-checker-evidence/**/negative.json
            receipt-checker-evidence/**/restored.json

      - name: Run the Python TUI core and governance lanes
        shell: bash # GitHub then runs bash -eo pipefail: tee cannot hide a red pytest
        run: |
          pytest tests_tui/ -m "core or (governance and not a2a_binary)" \
            --ignore=tests_tui/test_receipt_controls.py \
            -n auto --timeout=120 -v --durations=0 --junitxml=tui-results.xml 2>&1 | tee tui-results.log
        env:
          RUST_LOG: debug
          RUSTAIN_TUI_BINARY: ${{ github.workspace }}/target/debug/rustain
      - name: Reject Python TUI skips missing from the allowlist
        if: ${{ !cancelled() && hashFiles('tui-results.xml') != '' }}
        run: python3 .github/scripts/check-tui-skips.py tui-results.xml tests_tui/skip-allowlist.json
      - name: Retain Python TUI results and durations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-tui-results
          path: |
            tui-results.xml
            tui-results.log
      - name: Annotate test failures
        if: failure()
        run: python3 .github/scripts/annotate-test-failures.py receipt-policy-results.xml tui-results.xml

  tui-act2:
    name: Story 19.19 Executing Act 2
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: rui314/setup-mold@v1
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build A2A release capture binary
        run: cargo build --release --features a2a
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install native TUI capture dependencies
        run: pip install -e "./tests_tui[dev]"
      - name: Verify pinned carried Act 1 and Act 2 receipts
        run: |
          revision=$(git rev-parse --verify HEAD)
          python3 tests_tui/carried_j10_receipts.py --repository "$PWD" --revision "$revision"
          printf 'RUSTAIN_CARRIED_J10_REVISION=%s\n' "$revision" >> "$GITHUB_ENV"
      - name: Execute named Act 2 80-column capture without reruns
        env:
          RUSTAIN_TUI_BINARY: ${{ github.workspace }}/target/release/rustain
          RUSTAIN_CAPTURE_EVIDENCE_DIR: ${{ github.workspace }}/tests_tui/journeys/j10/receipts/evidence/${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          pytest 'tests_tui/test_story_19_19_act2_consultation.py::test_act2_consultation_adr_fanout[80]' \
            -p no:rerunfailures -n 0 --timeout=420 --junitxml=act2-results.xml -v
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          cases = ET.parse("act2-results.xml").findall(".//testcase")
          actual = [(case.attrib["classname"], case.attrib["name"]) for case in cases]
          expected = [("test_story_19_19_act2_consultation", "test_act2_consultation_adr_fanout[80]")]
          assert actual == expected, (actual, expected)
          assert all(case.find(tag) is None for case in cases for tag in ("skipped", "failure", "error")), "The required Act 2 case skipped/failed/errored"
          PY
      - name: Verify carried receipts after the fresh Act 2 capture
        run: python3 tests_tui/carried_j10_receipts.py --repository "$PWD" --revision "$RUSTAIN_CARRIED_J10_REVISION"
      - name: Annotate test failures
        if: failure()
        run: python3 .github/scripts/annotate-test-failures.py act2-results.xml
      - name: Retain actual capture receipts, evidence, and named-case results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: story-19-19-act2
          path: |
            act2-results.xml
            tests_tui/journeys/j10/receipts/evidence/${{ github.run_id }}-${{ github.run_attempt }}/**
  tui-act1:
    name: Story 19.21 Executing Act 1
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: rui314/setup-mold@v1
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build shipped release set capture binary
        run: cargo build --release --features self-update,relay-server,a2a,p2p,telegram,cron
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install native TUI capture dependencies
        run: pip install -e "./tests_tui[dev]"
      - name: Verify pinned carried Act 1 and Act 2 receipts
        run: |
          revision=$(git rev-parse --verify HEAD)
          python3 tests_tui/carried_j10_receipts.py --repository "$PWD" --revision "$revision"
          printf 'RUSTAIN_CARRIED_J10_REVISION=%s\n' "$revision" >> "$GITHUB_ENV"
      - name: Exercise standalone proposal Root-mode guards without reruns
        env:
          RUSTAIN_TUI_BINARY: ${{ github.workspace }}/target/release/rustain
          RUSTAIN_NAMED_PTY_EVIDENCE: ${{ github.workspace }}/named-pty-evidence/${{ github.run_id }}-${{ github.run_attempt }}/proposal-modes.jsonl
        run: |
          pytest \
            'tests_tui/test_story_19_21b_standalone_modes.py::test_standalone_auto_mode_still_requires_human_send[yolo]' \
            'tests_tui/test_story_19_21b_standalone_modes.py::test_standalone_auto_mode_still_requires_human_send[autoedit]' \
            -p no:rerunfailures -n 0 --timeout=120 --junitxml=proposal-modes-results.xml -v
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          cases = ET.parse("proposal-modes-results.xml").findall(".//testcase")
          actual = [(case.attrib["classname"], case.attrib["name"]) for case in cases]
          expected = {
              ("test_story_19_21b_standalone_modes", "test_standalone_auto_mode_still_requires_human_send[yolo]"),
              ("test_story_19_21b_standalone_modes", "test_standalone_auto_mode_still_requires_human_send[autoedit]"),
          }
          assert len(actual) == len(expected) and set(actual) == expected, (actual, expected)
          assert all(case.find(tag) is None for case in cases for tag in ("skipped", "failure", "error")), "A required proposal Root-mode case skipped/failed/errored"
          PY
      - name: Execute named Act 1 80x24 capture and daemon restart without reruns
        env:
          RUSTAIN_TUI_BINARY: ${{ github.workspace }}/target/release/rustain
          RUSTAIN_CAPTURE_EVIDENCE_DIR: ${{ github.workspace }}/tests_tui/journeys/j10/receipts/evidence/${{ github.run_id }}-${{ github.run_attempt }}
          RUSTAIN_NAMED_PTY_EVIDENCE: ${{ github.workspace }}/named-pty-evidence/${{ github.run_id }}-${{ github.run_attempt }}/act1.jsonl
        run: |
          pytest \
            'tests_tui/test_story_19_21_act1_distribution.py::test_act1_attached_distribution[80x24]' \
            'tests_tui/test_story_19_21_act1_distribution.py::test_act1_daemon_crash_restart' \
            -p no:rerunfailures -n 0 --timeout=420 --junitxml=act1-results.xml -v
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          cases = ET.parse("act1-results.xml").findall(".//testcase")
          actual = [(case.attrib["classname"], case.attrib["name"]) for case in cases]
          expected = {
              ("test_story_19_21_act1_distribution", "test_act1_attached_distribution[80x24]"),
              ("test_story_19_21_act1_distribution", "test_act1_daemon_crash_restart"),
          }
          assert len(actual) == len(expected) and set(actual) == expected, (actual, expected)
          assert all(case.find(tag) is None for case in cases for tag in ("skipped", "failure", "error")), "A required Act 1 case skipped/failed/errored"
          PY
      - name: Execute all genuine and policy canonical receipt controls
        env:
          RUSTAIN_RECEIPT_EVIDENCE_DIR: ${{ github.workspace }}/receipt-checker-evidence
        run: |
          pytest tests_tui/test_receipt_controls.py \
            -p no:rerunfailures -n 0 --timeout=120 --junitxml=receipt-checker-results.xml -v
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          cases = ET.parse("receipt-checker-results.xml").findall(".//testcase")
          actual = [(case.attrib["classname"], case.attrib["name"]) for case in cases]
          module = "test_receipt_controls"
          assert len(actual) == len(set(actual)) == 37, actual
          assert all(classname == module for classname, _ in actual), actual
          policy = {case for case in actual if case[1].startswith("test_canonical_")}
          genuine = {
              (module, f"test_genuine_receipt_rejects_changed_identity[{leg}]")
              for leg in ("scene", "source", "stamp")
          } | {
              (module, f"test_genuine_act1_receipt_rejects_changed_identity[80x24-{leg}]")
              for leg in ("scene", "source", "stamp")
          } | {
              (module, f"test_genuine_product_only_arbitrary_cwd[{capture}]")
              for capture in ("act2", "80x24")
          }
          assert len(policy) == 29 and set(actual) - policy == genuine, actual
          assert all(case.find(tag) is None for case in cases for tag in ("skipped", "failure", "error")), "A required canonical receipt control skipped/failed/errored"
          PY
      - name: Annotate test failures
        if: failure()
        run: python3 .github/scripts/annotate-test-failures.py proposal-modes-results.xml act1-results.xml receipt-checker-results.xml
      - name: Retain actual Act 1 receipts, evidence, and named-case results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: story-19-21-act1
          path: |
            act1-results.xml
            proposal-modes-results.xml
            receipt-checker-results.xml
            named-pty-evidence/${{ github.run_id }}-${{ github.run_attempt }}/act1.jsonl
            named-pty-evidence/${{ github.run_id }}-${{ github.run_attempt }}/proposal-modes.jsonl
            receipt-checker-evidence/**/positive.json
            receipt-checker-evidence/**/negative.json
            receipt-checker-evidence/**/restored.json
            tests_tui/journeys/j10/receipts/evidence/${{ github.run_id }}-${{ github.run_attempt }}/**

  tui-conflict-flag:
    name: Story 19.21h Executing Conflict Flag
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUSTAIN_TUI_BINARY: ${{ github.workspace }}/target/release/rustain
      RUSTAIN_CONFLICT_RECEIPT_MANIFEST: ${{ github.workspace }}/conflict-run-manifests/${{ github.run_id }}-${{ github.run_attempt }}.json
      RUSTAIN_CONFLICT_CAPTURE_RUN_ID: conflict-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: rui314/setup-mold@v1
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build shipped release set capture binary
        run: cargo build --locked --release --features self-update,relay-server,a2a,p2p,telegram,cron
      - name: Size ratchet
        run: .github/scripts/release-size-guard.sh target/release/rustain
      # Explicit bash makes both sides of the locked TLS dependency pipeline blocking.
      - name: Single TLS stack (rustls + ring)
        shell: bash
        run: |
          for features in '' self-update,relay-server,a2a,p2p,telegram,cron; do
            args=()
            if [ -n "$features" ]; then args=(--features "$features"); fi
            cargo tree --locked -e normal --prefix none --format '{p}' "${args[@]}" \
              | .github/scripts/single-tls-stack.sh "${features:-default}"
          done
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install native TUI capture dependencies
        run: pip install -e "./tests_tui[dev]"
      - name: Verify existing ephemeral TLS fixture tool
        run: openssl version
      - name: Execute exact conflict 80x24 capture without reruns
        env:
          RUSTAIN_CAPTURE_EVIDENCE_DIR: ${{ github.workspace }}/conflict-capture-evidence/${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          env -u RUSTAIN_TUI_CLIENT_BINARY -u RUSTAIN_CONFLICT_CAPTURE_ONLY pytest \
            'tests_tui/test_story_19_21b_conflict_flag.py::test_conflict_flag_capture[80x24]' \
            -p no:rerunfailures -n 0 --timeout=420 --junitxml=conflict-native-results.xml -v
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          cases = ET.parse("conflict-native-results.xml").findall(".//testcase")
          actual = [(case.attrib["classname"], case.attrib["name"]) for case in cases]
          expected = [("test_story_19_21b_conflict_flag", "test_conflict_flag_capture[80x24]")]
          assert actual == expected, (actual, expected)
          assert all(case.find(tag) is None for case in cases for tag in ("skipped", "failure", "error")), "A required conflict viewport skipped/failed/errored"
          PY
      - name: Execute exact three current conflict receipt controls
        env:
          RUSTAIN_RECEIPT_EVIDENCE_DIR: ${{ github.workspace }}/conflict-receipt-evidence
        run: |
          pytest \
            'tests_tui/test_story_19_21b_receipt_controls.py::test_current_conflict_receipt_rejects_independent_corruption[80x24-scene]' \
            'tests_tui/test_story_19_21b_receipt_controls.py::test_current_conflict_receipt_rejects_independent_corruption[80x24-source]' \
            'tests_tui/test_story_19_21b_receipt_controls.py::test_current_conflict_receipt_rejects_independent_corruption[80x24-stamp]' \
            -p no:rerunfailures -n 0 --timeout=120 --junitxml=conflict-integrity-results.xml -v
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          cases = ET.parse("conflict-integrity-results.xml").findall(".//testcase")
          actual = [(case.attrib["classname"], case.attrib["name"]) for case in cases]
          expected = {
              ("test_story_19_21b_receipt_controls", f"test_current_conflict_receipt_rejects_independent_corruption[80x24-{leg}]")
              for leg in ("scene", "source", "stamp")
          }
          assert len(actual) == len(expected) and set(actual) == expected, (actual, expected)
          assert all(case.find(tag) is None for case in cases for tag in ("skipped", "failure", "error")), "A required conflict integrity control skipped/failed/errored"
          PY
      - name: Annotate test failures
        if: failure()
        run: python3 .github/scripts/annotate-test-failures.py conflict-native-results.xml conflict-integrity-results.xml
      - name: Retain allowlisted conflict capture and integrity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: story-19-21b-conflict-flag
          path: |
            conflict-native-results.xml
            conflict-integrity-results.xml
            conflict-run-manifests/${{ github.run_id }}-${{ github.run_attempt }}.json
            conflict-capture-evidence/${{ github.run_id }}-${{ github.run_attempt }}/**/identity.json
            conflict-capture-evidence/${{ github.run_id }}-${{ github.run_attempt }}/**/checkpoints.json
            conflict-capture-evidence/${{ github.run_id }}-${{ github.run_attempt }}/**/*.http.json
            conflict-capture-evidence/${{ github.run_id }}-${{ github.run_attempt }}/**/requests.jsonl
            conflict-capture-evidence/${{ github.run_id }}-${{ github.run_attempt }}/**/*.screen.txt
            conflict-capture-evidence/${{ github.run_id }}-${{ github.run_attempt }}/**/*.team-log.json
            conflict-capture-evidence/${{ github.run_id }}-${{ github.run_attempt }}/**/story-19-21b-conflict-flag-*.transcript.txt
            conflict-receipt-evidence/**/positive.json
            conflict-receipt-evidence/**/negative.json
            conflict-receipt-evidence/**/restored.json
