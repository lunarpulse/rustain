name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Use the same `@stable` toolchain as every other job in this file (they pass).
      # An earlier `@1.94` pin (AI-12.1) resolved to a different 1.94.x lint set than
      # local and broke the `-D warnings` gate; if a future clippy bump adds lints, fix
      # them rather than re-pinning to a ref that drifts from contributors' `stable`.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Cross-target compile check (macOS cfg branches)
        if: false
        run: |
          rustup target add aarch64-apple-darwin
          cargo check --target aarch64-apple-darwin

      # Zero-warning gate (Epic 12 retro AI-12.1). The baseline was burned down to 0
      # across all feature lanes on 2026-06-12; `-D warnings` makes ANY warning a hard
      # failure. This REPLACES the prior warn-only + merge-base "0-new" diff, which let
      # a 257-warning baseline accumulate silently (every story reported "0-new" while
      # the baseline rotted). Documented per-lint exemptions live in src/lib.rs +
      # src/main.rs (kept in sync). vector-search is gated in nightly-vector-search.yml
      # (its `ort`/`fastembed` build pulls network and would slow per-PR CI).
      - name: Clippy (zero-warning gate — default)
        run: cargo clippy --all-targets -- -D warnings

      - name: Clippy (zero-warning gate — telegram+cron)
        run: cargo clippy --all-targets --features "telegram cron" -- -D warnings

      - name: Format
        run: cargo fmt --check

      - name: Event loop invariant check
        run: |
          if grep -nP '^\s*let\s+\w+\s*=\s*rx\.await' src/infrastructure/runtime/event_loop.rs; then
              echo "ERROR: rx.await inside event_loop.rs — see module invariant docs"
              exit 1
          fi

      - name: Test
        run: cargo test --lib
  skills-validation:
    name: Skills Validation Feature
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Test with skills-validation feature (lib only)
        run: cargo test --lib --features skills-validation

  vector-search:
    name: Vector Search Feature
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Compiles fastembed/ort + reqwest + bm25 and runs vector-search lib tests
      # plus the vector_search integration test (mockito-based, no real network).
      # The #[ignore] real-model / network tests do NOT run here — they are
      # exercised by the nightly-vector-search workflow.
      - name: Test with vector-search feature
        run: cargo test --features vector-search --test vector_search
  macos-unit:
    name: macOS Unit Tests (daemon/ProcInspector)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Detect daemon-related path changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            daemon-paths:
              - 'src/adapters/daemon/**'
              - 'src/infrastructure/paths.rs'
              - 'dist/**'
              - 'tests/daemon_*'
              - '.github/workflows/ci.yml'
              - '.github/workflows/nightly-daemon.yml'

      - name: Run macOS daemon lib tests
        if: steps.filter.outputs.daemon-paths == 'true' || github.event_name == 'push'
        run: |
          cargo test --lib adapters::daemon::pidfile
          cargo test --lib adapters::daemon::procargs

      - name: Run macOS daemon integration tests (non-ignored)
        if: steps.filter.outputs.daemon-paths == 'true' || github.event_name == 'push'
        run: cargo test --test daemon_crash_recovery
  tui-tests:
    name: Python TUI Tests
    runs-on: ubuntu-latest
    needs: [check]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build rustain binary
        run: cargo build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Python TUI test dependencies
        run: pip install -e "./tests_tui[dev]"

      - name: Run non-API Python TUI tests
        run: pytest tests_tui/ -m "not requires_api" -n auto --timeout=120 -v
        env:
          RUST_LOG: debug
