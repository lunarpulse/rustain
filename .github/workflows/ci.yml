name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Toolchain is pinned by rust-toolchain.toml (Grand Plan P0-5); the action ref
      # matches it so the runner installs exactly one toolchain. Bump both together.
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: rui314/setup-mold@v1
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned source-metric parser
        run: python3 -m pip install -r tools/ci/requirements-metrics.txt

      - name: Run real metric CLI and ratchet signoff behavioral controls
        run: |
          python3 - <<'PY'
          import sys
          import unittest
          suites = []
          for pattern in ("test_event_loop_complexity.py", "test_ratchet_signoff_guard.py"):
              suite = unittest.defaultTestLoader.discover(".github/scripts", pattern=pattern)
              if suite.countTestCases() == 0:
                  raise SystemExit(f"No behavioral controls selected: {pattern}")
              suites.append(suite)
          result = unittest.TextTestRunner(verbosity=2).run(unittest.TestSuite(suites))
          sys.exit(0 if result.wasSuccessful() else 1)
          PY

      - name: Cross-target compile check (macOS cfg branches)
        if: false
        run: |
          rustup target add aarch64-apple-darwin
          cargo check --target aarch64-apple-darwin

      # Clippy is BLOCKING again (Grand Plan P0-5). It was advisory while
      # rust-toolchain.toml floated on `stable` and the runner's lint set drifted
      # from local; the exact pin removes that drift. vector-search clippy lives in
      # nightly-vector-search.yml (its ort/fastembed build pulls network).
      - name: Clippy (default)
        run: cargo clippy --all-targets -- -D warnings

      - name: Clippy (telegram+cron)
        run: cargo clippy --all-targets --features "telegram cron" -- -D warnings

      - name: Clippy (a2a)
        run: cargo clippy --all-targets --features a2a -- -D warnings

      - name: Clippy (p2p)
        run: cargo clippy --all-targets --features p2p -- -D warnings

      - name: Format
        run: cargo fmt --check

      - name: Event loop invariant check
        run: |
          if grep -nP '^\s*let\s+\w+\s*=\s*rx\.await' src/infrastructure/runtime/event_loop.rs; then
              echo "ERROR: rx.await inside event_loop.rs — see module invariant docs"
              exit 1
          fi

      # The whole default suite, not an enumeration (Grand Plan P0-3/P0-5). Integration
      # tests are area binaries (tests/<area>/main.rs, Cargo.toml [[test]]); the lib
      # guards `every_integration_test_root_is_owned_by_one_area_binary` and
      # `every_integration_test_root_runs_in_a_ci_lane_with_its_features`
      # (src/domain/ports/capability_provider.rs) fail this job if a root is
      # unowned or if no invocation below enables the features a gated root needs.
      - name: Test
        run: |
          cargo test --all-targets --no-fail-fast
          # Roots gated on `test-instrumentation` alone (the CLI config/session
          # targets in `cli`, the standalone approval/response-mode keystones in
          # `a2a`) compile out of the default build; run those binaries with the
          # feature on and nothing else, so the keystones execute without `a2a`.
          cargo test --features test-instrumentation --test cli --test a2a
  skills-validation:
    name: Skills Validation Feature
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: rui314/setup-mold@v1
      - uses: Swatinem/rust-cache@v2

      - name: Test with skills-validation feature (lib only)
        run: cargo test --lib --features skills-validation

  a2a:
    name: A2A Feature
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: rui314/setup-mold@v1
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # This lane executes tests/conformance.rs, including its fail-closed metric.
      - name: Install pinned source-metric parser
        run: python3 -m pip install -r tools/ci/requirements-metrics.txt

      # Story 17.4b standing ruling: every A2A integration test must EXECUTE in CI,
      # not merely compile. Since Grand Plan P0-3 the a2a-gated roots live in the
      # `a2a` area binary (tests/a2a/main.rs) and the whole suite runs here under the
      # feature; the lib guard `every_integration_test_root_runs_in_a_ci_lane_with_its_features`
      # fails the DEFAULT lane if a gated root has no invocation that enables it.
      #
      # `test-instrumentation` is REQUIRED, not incidental: AC2b's zero-mutation
      # ratchet and AC7b's card-signing counter are both cfg'd behind it, and without
      # it those keystones would silently degrade to their behavioural halves. Pinned
      # by `the_ci_a2a_lane_enables_the_zero_mutation_ratchet`.
      - name: Test with a2a feature (lib + whole suite)
        run: |
          cargo test --lib --features a2a,test-instrumentation
          cargo test --features a2a,test-instrumentation --all-targets --no-fail-fast

      - name: Execute the real cron proposal front-door consumers
        run: |
          set -o pipefail
          cargo test --locked --features a2a,test-instrumentation,cron \
            --test a2a -- --exact \
            conformance_19_21_a2a_distribution::g_entrypoints::cron_scheduler_job_denies_proposal_with_trusted_writer \
            conformance_19_21_a2a_distribution::g_k06_payload::interleaved_cron_keeps_attached_proposal_on_invoking_conversation \
            | tee cron-proposal-results.txt
          python3 - <<'PY'
          import pathlib, re
          text = pathlib.Path("cron-proposal-results.txt").read_text()
          names = [
              "conformance_19_21_a2a_distribution::g_entrypoints::cron_scheduler_job_denies_proposal_with_trusted_writer",
              "conformance_19_21_a2a_distribution::g_k06_payload::interleaved_cron_keeps_attached_proposal_on_invoking_conversation",
          ]
          assert re.search(r"^running 2 tests$", text, re.M), "Cron proposal consumers selected zero/wrong tests"
          for name in names:
              assert re.search(r"^test " + re.escape(name) + r" \.\.\. ok$", text, re.M), text
          assert re.search(r"^test result: ok\. 2 passed; 0 failed; 0 ignored;", text, re.M), text
          PY
      - name: Retain named cron proposal caller result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: story-19-21g-cron
          path: cron-proposal-results.txt

  p2p:
    name: P2P Feature
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: rui314/setup-mold@v1
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The whole-suite run includes the `core` binary's fail-closed complexity metric.
      - name: Install pinned source-metric parser
        run: python3 -m pip install -r tools/ci/requirements-metrics.txt

      # Run only bans: aggregate `cargo deny check` is intentionally excluded because this
      # repository has no `[licenses]` allowlist and its baseline `lru 0.16.3` advisory makes
      # that broader check red for reasons outside this story.
      - name: Dependency bans (p2p)
        run: |
          cargo install --locked cargo-deny
          cargo deny check bans

      # The default Check job never enables this non-default transport feature.
      # The p2p-gated roots live in the `p2p` area binary (tests/p2p/main.rs); the
      # relay targets additionally need `p2p-test-utils` (hermetic relay fixture,
      # `bind_without_direct_paths` — `debug_assertions`-gated, so this stays a
      # debug-profile run) and the relay-server target needs `relay-server`. One
      # invocation with the union runs them all; the lib guard
      # `every_integration_test_root_runs_in_a_ci_lane_with_its_features` checks it.
      - name: Test with p2p feature (lib + whole suite)
        run: |
          cargo test --lib --features p2p
          cargo test --features p2p,p2p-test-utils,relay-server --all-targets --no-fail-fast
  mcp:
    name: MCP Feature
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: rui314/setup-mold@v1
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The whole-suite run includes the `core` binary's fail-closed complexity metric.
      - name: Install pinned source-metric parser
        run: python3 -m pip install -r tools/ci/requirements-metrics.txt

      # Story 17.5a: MCP integration targets must execute, not merely compile.
      # MCP itself is a default feature, so the Check job's whole-suite run already
      # covers the surface WITHOUT the fake server; this lane adds `test-fake-mcp`,
      # which turns on the fake-server-backed roots in the `mcp` area binary
      # (tests/mcp/main.rs) and the fake-backed cases in `cli`/`orchestration`.
      # A true MCP-off build (`--no-default-features`) is pre-existing broken by
      # DF-17-4a-6: runtime, startup and ACP reference MCP-gated adapters.
      - name: Test with the fake MCP server (lib + whole suite)
        run: |
          cargo test --lib --features mcp
          cargo test --features test-fake-mcp --all-targets --no-fail-fast

  vector-search:
    name: Heavy Feature Lanes (vector-search, wasm-sandbox)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: rui314/setup-mold@v1
      - uses: Swatinem/rust-cache@v2

      # Compiles fastembed/ort + reqwest + bm25 and runs the vector-search lib
      # tests plus the `memory` area binary, which owns tests/vector_search.rs
      # and tests/regression_removal_integrity.rs (mockito-based, no real
      # network). The #[ignore] real-model / network tests do NOT run here —
      # they are exercised by the nightly-vector-search workflow.
      - name: Test with vector-search feature
        run: cargo test --features vector-search --test memory

      # tests/wasm_execution_sandbox.rs (module of `orchestration`) is gated on
      # `wasm-sandbox` and, until Grand Plan P0-3, ran in no workflow at all — a
      # false green the lib guard now refuses. wasmtime is heavy, so it rides this
      # already-heavy lane rather than Check.
      - name: Test with wasm-sandbox feature
        run: "cargo test --features wasm-sandbox --test orchestration wasm_execution_sandbox::"
  macos-unit:
    name: macOS Unit Tests (daemon/ProcInspector)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2

      - name: Detect daemon-related path changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            daemon-paths:
              - 'src/adapters/daemon/**'
              - 'src/infrastructure/paths.rs'
              - 'dist/**'
              - 'tests/daemon_*'
              - '.github/workflows/ci.yml'
              - '.github/workflows/nightly-daemon.yml'

      - name: Run macOS daemon lib tests
        if: steps.filter.outputs.daemon-paths == 'true' || github.event_name == 'push'
        run: |
          cargo test --lib adapters::daemon::pidfile
          cargo test --lib adapters::daemon::procargs

      # tests/daemon_crash_recovery.rs is a module of the `daemon` area binary;
      # the filter keeps this job to that module's non-ignored tests.
      - name: Run macOS daemon integration tests (non-ignored)
        if: steps.filter.outputs.daemon-paths == 'true' || github.event_name == 'push'
        run: "cargo test --test daemon daemon_crash_recovery::"
  tui-tests:
    name: Python TUI Tests
    runs-on: ubuntu-latest
    needs: [check]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: rui314/setup-mold@v1
      - uses: Swatinem/rust-cache@v2

      - name: Build rustain binary
        run: cargo build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Python TUI test dependencies
        run: pip install -e "./tests_tui[dev]"

      - name: Execute canonical receipt policy controls without reruns
        env:
          RUSTAIN_RECEIPT_EVIDENCE_DIR: ${{ github.workspace }}/receipt-checker-evidence
        run: |
          pytest tests_tui/test_receipt_controls.py -m "not a2a_binary" \
            -p no:rerunfailures -n 0 --timeout=120 --junitxml=receipt-policy-results.xml -v
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          cases = ET.parse("receipt-policy-results.xml").findall(".//testcase")
          assert len(cases) == 29 and len({case.attrib["name"] for case in cases}) == 29, cases
          assert all(case.find(tag) is None for case in cases for tag in ("skipped", "failure", "error")), "A required receipt policy control skipped/failed/errored"
          PY
      - name: Retain allowlisted receipt policy diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: receipt-policy-controls
          path: |
            receipt-policy-results.xml
            receipt-checker-evidence/**/positive.json
            receipt-checker-evidence/**/negative.json
            receipt-checker-evidence/**/restored.json

      - name: Run non-API Python TUI tests
        run: pytest tests_tui/ -m "not requires_api and not a2a_binary" -n auto --timeout=120 -v
        env:
          RUST_LOG: debug

  tui-act2:
    name: Story 19.19 Executing Act 2
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: rui314/setup-mold@v1
      - uses: Swatinem/rust-cache@v2
      - name: Build A2A release capture binary
        run: cargo build --release --features a2a
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install native TUI capture dependencies
        run: pip install -e "./tests_tui[dev]"
      - name: Execute both named Act 2 viewports without reruns
        env:
          RUSTAIN_TUI_BINARY: ${{ github.workspace }}/target/release/rustain
          RUSTAIN_CAPTURE_EVIDENCE_DIR: ${{ github.workspace }}/tests_tui/journeys/j10/receipts/evidence/${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          pytest tests_tui/test_story_19_19_act2_consultation.py::test_act2_consultation_adr_fanout \
            -p no:rerunfailures -n 0 --timeout=420 --junitxml=act2-results.xml -v
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          cases = ET.parse("act2-results.xml").findall(".//testcase")
          expected = {"test_act2_consultation_adr_fanout[80]", "test_act2_consultation_adr_fanout[130]"}
          assert {case.attrib["name"] for case in cases} == expected and len(cases) == 2, cases
          assert all(case.find(tag) is None for case in cases for tag in ("skipped", "failure", "error")), "A required Act 2 case skipped/failed/errored"
          PY
      - name: Retain actual capture receipts, evidence, and named-case results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: story-19-19-act2
          path: |
            act2-results.xml
            tests_tui/journeys/j10/receipts/evidence/${{ github.run_id }}-${{ github.run_attempt }}/**
  tui-act1:
    name: Story 19.21 Executing Act 1
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: rui314/setup-mold@v1
      - uses: Swatinem/rust-cache@v2
      - name: Build four-feature release capture binary
        run: cargo build --release --features self-update,relay-server,a2a,p2p
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install native TUI capture dependencies
        run: pip install -e "./tests_tui[dev]"
      - name: Exercise standalone proposal Root-mode guards without reruns
        env:
          RUSTAIN_TUI_BINARY: ${{ github.workspace }}/target/release/rustain
        run: |
          pytest tests_tui/test_story_19_21b_standalone_modes.py \
            -p no:rerunfailures -n 0 --timeout=120 --junitxml=proposal-modes-results.xml -v
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          cases = ET.parse("proposal-modes-results.xml").findall(".//testcase")
          expected = {
              "test_standalone_auto_mode_still_requires_human_send[yolo]",
              "test_standalone_auto_mode_still_requires_human_send[autoedit]",
          }
          assert {case.attrib["name"] for case in cases} == expected and len(cases) == 2, cases
          assert all(case.find(tag) is None for case in cases for tag in ("skipped", "failure", "error")), "A required proposal Root-mode case skipped/failed/errored"
          PY
      - name: Execute named Act 1 viewports and daemon restart without reruns
        env:
          RUSTAIN_TUI_BINARY: ${{ github.workspace }}/target/release/rustain
          RUSTAIN_CAPTURE_EVIDENCE_DIR: ${{ github.workspace }}/tests_tui/journeys/j10/receipts/evidence/${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          pytest \
            'tests_tui/test_story_19_21_act1_distribution.py::test_act1_attached_distribution[80x24]' \
            'tests_tui/test_story_19_21_act1_distribution.py::test_act1_attached_distribution[130x30]' \
            'tests_tui/test_story_19_21_act1_distribution.py::test_act1_attached_distribution[60x16]' \
            'tests_tui/test_story_19_21_act1_distribution.py::test_act1_daemon_crash_restart' \
            -p no:rerunfailures -n 0 --timeout=420 --junitxml=act1-results.xml -v
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          cases = ET.parse("act1-results.xml").findall(".//testcase")
          expected = {
              "test_act1_attached_distribution[80x24]",
              "test_act1_attached_distribution[130x30]",
              "test_act1_attached_distribution[60x16]",
              "test_act1_daemon_crash_restart",
          }
          assert {case.attrib["name"] for case in cases} == expected and len(cases) == 4, cases
          assert all(case.find(tag) is None for case in cases for tag in ("skipped", "failure", "error")), "A required Act 1 case skipped/failed/errored"
          PY
      - name: Execute all genuine and policy canonical receipt controls
        env:
          RUSTAIN_RECEIPT_EVIDENCE_DIR: ${{ github.workspace }}/receipt-checker-evidence
        run: |
          pytest tests_tui/test_receipt_controls.py \
            -p no:rerunfailures -n 0 --timeout=120 --junitxml=receipt-checker-results.xml -v
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          cases = ET.parse("receipt-checker-results.xml").findall(".//testcase")
          names = [case.attrib["name"] for case in cases]
          assert len(cases) == 45 and len(set(names)) == 45, names
          for prefix, count in [
              ("test_genuine_receipt_rejects_changed_identity[", 3),
              ("test_genuine_act1_receipt_rejects_changed_identity[", 9),
              ("test_genuine_product_only_arbitrary_cwd[", 4),
          ]:
              assert sum(name.startswith(prefix) for name in names) == count, (prefix, names)
          assert all(case.find(tag) is None for case in cases for tag in ("skipped", "failure", "error")), "A required canonical receipt control skipped/failed/errored"
          PY
      - name: Retain actual Act 1 receipts, evidence, and named-case results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: story-19-21-act1
          path: |
            act1-results.xml
            proposal-modes-results.xml
            receipt-checker-results.xml
            receipt-checker-evidence/**/positive.json
            receipt-checker-evidence/**/negative.json
            receipt-checker-evidence/**/restored.json
            tests_tui/journeys/j10/receipts/evidence/${{ github.run_id }}-${{ github.run_attempt }}/**

  tui-conflict-flag:
    name: Story 19.21h Executing Conflict Flag
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUSTAIN_TUI_BINARY: ${{ github.workspace }}/target/release/rustain
      RUSTAIN_CONFLICT_RECEIPT_MANIFEST: ${{ github.workspace }}/conflict-run-manifests/${{ github.run_id }}-${{ github.run_attempt }}.json
      RUSTAIN_CONFLICT_CAPTURE_RUN_ID: conflict-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: rui314/setup-mold@v1
      - uses: Swatinem/rust-cache@v2
      - name: Build four-feature release capture binary
        run: cargo build --locked --release --features self-update,relay-server,a2a,p2p
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install native TUI capture dependencies
        run: pip install -e "./tests_tui[dev]"
      - name: Verify existing ephemeral TLS fixture tool
        run: openssl version
      - name: Execute exact conflict viewports without reruns
        env:
          RUSTAIN_CAPTURE_EVIDENCE_DIR: ${{ github.workspace }}/conflict-capture-evidence/${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          env -u RUSTAIN_TUI_CLIENT_BINARY pytest \
            'tests_tui/test_story_19_21b_conflict_flag.py::test_conflict_flag_capture[80x24]' \
            'tests_tui/test_story_19_21b_conflict_flag.py::test_conflict_flag_capture[130x30]' \
            'tests_tui/test_story_19_21b_conflict_flag.py::test_conflict_flag_capture[60x16]' \
            -p no:rerunfailures -n 0 --timeout=420 --junitxml=conflict-native-results.xml -v
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          cases = ET.parse("conflict-native-results.xml").findall(".//testcase")
          expected = {f"test_conflict_flag_capture[{viewport}]" for viewport in ("80x24", "130x30", "60x16")}
          assert len(cases) == 3 and {case.attrib["name"] for case in cases} == expected, cases
          assert all(case.find(tag) is None for case in cases for tag in ("skipped", "failure", "error")), "A required conflict viewport skipped/failed/errored"
          PY
      - name: Execute exact nine current conflict receipt controls
        env:
          RUSTAIN_RECEIPT_EVIDENCE_DIR: ${{ github.workspace }}/conflict-receipt-evidence
        run: |
          pytest \
            'tests_tui/test_story_19_21b_receipt_controls.py::test_current_conflict_receipt_rejects_independent_corruption[80x24-scene]' \
            'tests_tui/test_story_19_21b_receipt_controls.py::test_current_conflict_receipt_rejects_independent_corruption[80x24-source]' \
            'tests_tui/test_story_19_21b_receipt_controls.py::test_current_conflict_receipt_rejects_independent_corruption[80x24-stamp]' \
            'tests_tui/test_story_19_21b_receipt_controls.py::test_current_conflict_receipt_rejects_independent_corruption[130x30-scene]' \
            'tests_tui/test_story_19_21b_receipt_controls.py::test_current_conflict_receipt_rejects_independent_corruption[130x30-source]' \
            'tests_tui/test_story_19_21b_receipt_controls.py::test_current_conflict_receipt_rejects_independent_corruption[130x30-stamp]' \
            'tests_tui/test_story_19_21b_receipt_controls.py::test_current_conflict_receipt_rejects_independent_corruption[60x16-scene]' \
            'tests_tui/test_story_19_21b_receipt_controls.py::test_current_conflict_receipt_rejects_independent_corruption[60x16-source]' \
            'tests_tui/test_story_19_21b_receipt_controls.py::test_current_conflict_receipt_rejects_independent_corruption[60x16-stamp]' \
            -p no:rerunfailures -n 0 --timeout=120 --junitxml=conflict-integrity-results.xml -v
          python3 - <<'PY'
