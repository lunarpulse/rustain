name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: Format
        run: cargo fmt --check

      - name: Event loop invariant check
        run: |
          if grep -nP '^\s*let\s+\w+\s*=\s*rx\.await' src/infrastructure/runtime/event_loop.rs; then
              echo "ERROR: rx.await inside event_loop.rs — see module invariant docs"
              exit 1
          fi

      - name: Test
        run: cargo test

  skills-validation:
    name: Skills Validation Feature
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Test with skills-validation feature
        run: cargo test --features skills-validation

  vector-search:
    name: Vector Search Feature (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Compiles fastembed/ort + reqwest + bm25 and runs every NON-ignored test
      # under the feature. This is the PR-level guard for:
      #   - R-001 removal-integrity regression (tests/regression_removal_integrity.rs)
      #   - 11-3b mockito dimension/auth/status locks (tests/vector_search.rs::remote_http)
      #   - vector-search composition + delegation tests
      # The #[ignore] real-network / model-download tests do NOT run here — they
      # are exercised by the nightly-vector-search workflow.
      - name: Test with vector-search feature (no ignored network tests)
        run: cargo test --features vector-search

  tui-tests:
    name: Python TUI Tests
    runs-on: ubuntu-latest
    needs: [check]
    defaults:
      run:
        working-directory: rustain
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build rustain binary
        run: cargo build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Python TUI test dependencies
        run: pip install -e "./tests_tui[dev]"

      - name: Run non-API Python TUI tests
        run: pytest tests_tui/ -m "not requires_api" --timeout=120 -v
