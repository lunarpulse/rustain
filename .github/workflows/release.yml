name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write  # GITHUB_TOKEN needs this to create releases + upload assets

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # P0 — Linux x86_64 (required)
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            exe: ""
            required: true

          # P1 — macOS aarch64 (best-effort, fail OK)
          - target: aarch64-apple-darwin
            os: macos-latest
            exe: ""
            required: false

          # P1 — macOS x86_64 (best-effort, fail OK)
          - target: x86_64-apple-darwin
            os: macos-latest
            exe: ""
            required: false

          # P2 — Windows x86_64 (best-effort, fail OK)
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            exe: ".exe"
            required: false

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Stage asset
        shell: bash
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          ASSET="rustain-${VERSION}-${{ matrix.target }}${{ matrix.exe }}"
          cp "target/${{ matrix.target }}/release/rustain${{ matrix.exe }}" "${ASSET}"
          ls -lh "${ASSET}"
          echo "ASSET=${ASSET}" >> "$GITHUB_ENV"

      - name: Size guard (< 30 MB)
        shell: bash
        run: |
          SIZE=$(stat -c%s "${ASSET}" 2>/dev/null || stat -f%z "${ASSET}")
          SIZE_MB=$((SIZE / 1024 / 1024))
          echo "Binary size: ${SIZE_MB} MB (${SIZE} bytes)"
          if [ "$SIZE" -gt "$((30 * 1024 * 1024))" ]; then
            echo "ERROR: Binary exceeds 30 MB limit (NFR9)"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  sign:
    name: Sign & Publish
    needs: build
    runs-on: ubuntu-latest
    # Run even if some matrix jobs failed (e.g., Windows P2 best-effort)
    # We only sign artifacts from successful builds.
    if: always() && !cancelled()
    # Protected environment — required reviewers + encrypted secrets
    environment: release
    steps:
      - uses: actions/checkout@v4

      - name: Install minisign
        run: |
          if ! command -v minisign >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y minisign
          fi
          minisign --version || minisign -v || true
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false

      - name: Flatten artifacts
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          ls -la release/

      - name: Generate SHA256SUMS
        run: |
          cd release
          sha256sum rustain-* > SHA256SUMS
          cat SHA256SUMS

      - name: Sign SHA256SUMS (prehashed ED)
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          # Normalize the secret key into the 2-line format minisign requires:
          #   line 1: "untrusted comment: ..." (header)
          #   line 2: base64 secret key
          # If the user pasted only the base64 line into the GitHub secret, prepend
          # the comment. minisign's loader rejects a file with no comment line.
          if printf '%s' "$MINISIGN_SECRET_KEY" | head -1 | grep -q '^untrusted'; then
            printf '%s\n' "$MINISIGN_SECRET_KEY" > /tmp/minisign.key
          else
            {
              echo 'untrusted comment: minisign encrypted secret key'
              printf '%s\n' "$MINISIGN_SECRET_KEY"
            } > /tmp/minisign.key
          fi
          chmod 600 /tmp/minisign.key
          # -W: passwordless key. -H: prehashed (Blake2b→Ed25519, large-file appropriate).
          minisign -S -H -W \
            -m release/SHA256SUMS \
            -s /tmp/minisign.key \
            -x release/SHA256SUMS.minisig \
            -t "rustain ${GITHUB_REF_NAME}"
          rm -f /tmp/minisign.key

      - name: Verify signature (fail-closed)
        env:
          MINISIGN_PUBLIC_KEY: ${{ secrets.MINISIGN_PUBLIC_KEY }}
        run: |
          # -P takes the pubkey as a base64 string (pinned trust — no fetched key)
          minisign -V -m release/SHA256SUMS -x release/SHA256SUMS.minisig -P "$MINISIGN_PUBLIC_KEY"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Report sizes
        run: |
          echo "## Release Asset Sizes" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          ls -lh release/rustain-* | awk '{print "- " $9 ": " $5}' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "SHA256SUMS and SHA256SUMS.minisig also published." >> "$GITHUB_STEP_SUMMARY"
