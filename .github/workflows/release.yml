name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write  # GITHUB_TOKEN needs this to create releases + upload assets

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # P0 — Linux x86_64 (required)
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            exe: ""

          # P1 — macOS aarch64 (best-effort, fail OK)
          - target: aarch64-apple-darwin
            os: macos-latest
            exe: ""

          # P1 — macOS x86_64 (best-effort, fail OK)
          - target: x86_64-apple-darwin
            os: macos-latest
            exe: ""

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        # `--features self-update` is REQUIRED: self-update is NOT a default feature
        # (Cargo.toml default = anthropic/openai/ollama/clipboard/mcp/meta-search/models-dev).
        # Without it the published binary hits the feature-absent bail and `rustain
        # update` does not exist — the feature would ship dead (Story 13-3a B0).
        #
        # `--features relay-server` is REQUIRED for the same reason and by a
        # measured rule (Story 18.4c-b AC7/A3): without it `rustain relay serve`
        # bails on the feature check and self-hosting a relay needs a source build,
        # so FR159's "blessed subcommand" would not be one. Measured 2026-08-17 on
        # x86_64-linux: default release 21,832,840 B → with relay-server
        # 24,935,304 B, a delta of 3,102,464 B (2.96 MiB) — inside NFR53's 5 MB
        # per-feature bound, which is what decided it.
        #
        # Story 19.5 adds `a2a,p2p` so published assets contain the federation
        # features proved by gates 18 and 19. Measured 2026-08-30 on x86_64-linux:
        # all four release-only features produce 34,263,656 B (32.68 MiB), within
        # NFR9's amended 35 MiB / 36,700,160-byte guard below.
        run: cargo build --release --target ${{ matrix.target }} --features self-update,relay-server,a2a,p2p

      - name: Stage asset
        shell: bash
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          ASSET="rustain-${VERSION}-${{ matrix.target }}${{ matrix.exe }}"
          cp "target/${{ matrix.target }}/release/rustain${{ matrix.exe }}" "${ASSET}"
          ls -lh "${ASSET}"
          echo "ASSET=${ASSET}" >> "$GITHUB_ENV"

      - name: Smoke required release features
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        run: .github/scripts/release-smoke.sh "${ASSET}"

      # NFR9 bound AMENDED 2026-08-31 by Story 9.9 (owner ruling,
      # measurement-driven): 36,700,160 → 39,845,888. The Streamable HTTP
      # client transport measured 38,154,880 B on the shipped feature set, of
      # which the TLS backend alone is 2,740,848 B. See prd.md NFR9 for the
      # four measured rows and why the ceiling moved instead of the capability.
      - name: Size guard (≤ 38 MiB)
        shell: bash
        run: |
          SIZE=$(stat -c%s "${ASSET}" 2>/dev/null || stat -f%z "${ASSET}")
          SIZE_MIB=$((SIZE / 1024 / 1024))
          echo "Binary size: ${SIZE_MIB} MiB (${SIZE} bytes)"
          if [ "$SIZE" -gt "39845888" ]; then
            echo "ERROR: ${{ matrix.target }} binary exceeds 38 MiB limit (NFR9)"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  sign:
    name: Sign & Publish
    needs: build
    runs-on: ubuntu-latest
    # Run even if some matrix jobs failed.
    # We only sign artifacts from successful builds.
    if: always() && !cancelled()
    # Protected environment — required reviewers + encrypted secrets
    environment: release
    steps:
      - uses: actions/checkout@v4

      - name: Install minisign
        run: |
          if ! command -v minisign >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y minisign
          fi
          minisign --version || minisign -v || true
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false

      - name: Flatten artifacts
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          ls -la release/

      - name: Compute expected-minus-present release targets
        id: release-target-delta
        shell: bash
        run: |
          # The expected set IS the build matrix above (:25-39) — three targets.
          # ⛔ Never list a triple no leg builds: an always-missing entry makes the
          # disclosure fire on every release and a real macOS loss becomes
          # indistinguishable from the baseline (Story 19.5 code review).
          # Windows x86_64 is P2 and excluded from both matrix and assets
          # (RELEASING.md § Platform Support Matrix), so it is not expected here.
          expected_targets=(
            x86_64-unknown-linux-gnu
            x86_64-apple-darwin
            aarch64-apple-darwin
          )
          missing_targets=()
          for target in "${expected_targets[@]}"; do
            if ! compgen -G "release/rustain-*-${target}" >/dev/null; then
              missing_targets+=("${target}")
            fi
          done

          {
            echo 'body<<EOF'
            echo '## Release asset coverage'
            echo
            if [ "${#missing_targets[@]}" -eq 0 ]; then
              echo 'All expected release targets are present.'
            else
              printf 'Missing targets (expected minus present):'
              printf ' `%s`' "${missing_targets[@]}"
              echo '.'
              echo
              echo 'Linux is P0; this release still publishes when only P1 macOS assets are missing.'
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Verify P0 Linux artifact exists (AC1 required)
        run: |
          if ! ls release/rustain-*-x86_64-unknown-linux-gnu 2>/dev/null; then
            echo "ERROR: P0 Linux x86_64 artifact missing — cannot publish release"
            exit 1
          fi

      - name: Generate SHA256SUMS
        run: |
          cd release
          if ! ls rustain-* >/dev/null 2>&1; then
            echo "ERROR: No release artifacts found"
            exit 1
          fi
          sha256sum rustain-* > SHA256SUMS
          cat SHA256SUMS

      - name: Sign SHA256SUMS (prehashed ED)
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          # Normalize the secret key into the 2-line format minisign requires:
          #   line 1: "untrusted comment: ..." (header)
          #   line 2: base64 secret key
          # Handle both real newlines and literal \n in the GitHub secret value.
          KEY="$(printf '%s' "$MINISIGN_SECRET_KEY" | sed 's/\\n/\n/g')"
          if printf '%s' "$KEY" | head -1 | grep -q '^untrusted'; then
            printf '%s\n' "$KEY" > /tmp/minisign.key
          else
            {
              echo 'untrusted comment: minisign encrypted secret key'
              printf '%s\n' "$KEY"
            } > /tmp/minisign.key
          fi
          chmod 600 /tmp/minisign.key
          # -W: passwordless key. -H: prehashed (Blake2b→Ed25519, large-file appropriate).
          minisign -S -H -W \
            -m release/SHA256SUMS \
            -s /tmp/minisign.key \
            -x release/SHA256SUMS.minisig \
            -t "rustain ${GITHUB_REF_NAME}"
          rm -f /tmp/minisign.key

      - name: Verify signature (fail-closed)
        env:
          MINISIGN_PUBLIC_KEY: ${{ secrets.MINISIGN_PUBLIC_KEY }}
        run: |
          # -P takes the pubkey as a base64 string (pinned trust — no fetched key)
          minisign -V -m release/SHA256SUMS -x release/SHA256SUMS.minisig -P "$MINISIGN_PUBLIC_KEY"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          body: ${{ steps.release-target-delta.outputs.body }}
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Report sizes
        run: |
          echo "## Release Asset Sizes" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          ls -lh release/rustain-* | awk '{print "- " $9 ": " $5}' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "SHA256SUMS and SHA256SUMS.minisig also published." >> "$GITHUB_STEP_SUMMARY"
