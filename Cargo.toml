[package]
name = "rustain"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A fast, extensible, terminal-native AI coding agent"
license = "MIT"
readme = "README.md"

[lib]
name = "rustain"
path = "src/lib.rs"

[[bin]]
name = "rustain"
path = "src/main.rs"

[dependencies]
# ── Async runtime ────────────────────────────────────────────────
tokio = { version = "1.50", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"

# ── TUI framework ────────────────────────────────────────────────
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }

# ── CLI parsing ──────────────────────────────────────────────────
clap = { version = "4.5", features = ["derive"] }

# ── Serialization ────────────────────────────────────────────────
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# ── Error handling ───────────────────────────────────────────────
thiserror = "2.0"
anyhow = "1.0"

# ── Logging / tracing ───────────────────────────────────────────
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# ── HTTP client (provider adapters) ─────────────────────────────
reqwest = { version = "0.12", features = ["stream", "json", "rustls-tls"], optional = true }

# ── Encoding ─────────────────────────────────────────────────────
base64 = "0.22"

# ── Utilities ────────────────────────────────────────────────────
async-trait = "0.1"
arc-swap = "1.7"
nanoid = "0.4"
dirs = "6.0"
sha2 = "0.10"
unicode-width = "0.2"
arboard = { version = "3", optional = true }
png = { version = "0.17", optional = true }
pulldown-cmark = "0.13"
# chrono = { version = "0.4", features = ["serde"] }  # Re-add when time formatting is needed

# ── Rustycode path deps — uncomment in Story 1.2 ────────────────
# Verify crossterm/ratatui version compatibility with rustycode before enabling
# domain = { path = "../rustycode/domain" }
# adapters = { path = "../rustycode/adapters" }
# llm-provider = { path = "../rustycode/llm-provider", features = ["config"] }

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.0"
pretty_assertions = "1"
mockito = "1"
serial_test = "3"

[features]
default = ["anthropic", "clipboard"]
anthropic = ["dep:reqwest"]
clipboard = ["dep:arboard", "dep:png"]
openai = []

[profile.release]
lto = true
strip = true
codegen-units = 1
