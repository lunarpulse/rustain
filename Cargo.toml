[package]
name = "rustain"
version = "0.1.0"
edition = "2024"
description = "A Claudian-like terminal UI for AI-assisted development"
license = "MIT"
readme = "README.md"

[[bin]]
name = "rustain"
path = "src/main.rs"

[dependencies]
# ── Rustycode libraries (selective path deps) ───────────────────
# Only import what rustain needs: provider adapters, tools, MCP client
# Skip: application layer (request-response), DI container
domain = { path = "../rustycode/domain" }
adapters = { path = "../rustycode/adapters" }
llm-provider = { path = "../rustycode/llm-provider", features = ["config"] }
# llm-context-rag = { path = "../rustycode/llm-context-rag", features = ["lancedb-adapter", "embeddings"] }  # V2: RAG context

# ── TUI framework ────────────────────────────────────────────────
ratatui = "0.29"
crossterm = "0.28"

# ── Streaming HTTP client ────────────────────────────────────────
reqwest = { version = "0.12", features = ["json", "stream"] }
reqwest-eventsource = "0.6"
async-trait = "0.1"
futures = "0.3"

# ── Async runtime ────────────────────────────────────────────────
tokio = { version = "1", features = ["full"] }

# ── Serialization ────────────────────────────────────────────────
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# ── Logging / tracing ───────────────────────────────────────────
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# ── Markdown rendering ───────────────────────────────────────────
pulldown-cmark = "0.12"

# ── Utilities ────────────────────────────────────────────────────
anyhow = "1"
dirs = "6"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
rand = "0.9"

[dev-dependencies]
pretty_assertions = "1"
