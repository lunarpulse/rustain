[package]
name = "rustain"
version = "0.1.2"
edition = "2024"
rust-version = "1.91"
description = "A fast, extensible, terminal-native AI coding agent"
license = "MIT"
readme = "README.md"
repository = "https://github.com/lunarpulse/rustain"
[lib]
name = "rustain"
path = "src/lib.rs"

[[bin]]
name = "rustain"
path = "src/main.rs"
test = false
[[bin]]
name = "fake-mcp-server"
path = "tests/common/fake_mcp_server.rs"
test = true
bench = false
required-features = ["test-fake-mcp"]
[[bin]]
name = "startup-panic-harness"
path = "tests/common/startup_panic_harness.rs"
test = false

[[test]]
name = "scheduler_overhead"
path = "perf-tests/scheduler_overhead.rs"

[[test]]
name = "subagent_spawn"
path = "perf-tests/subagent_spawn.rs"

[dependencies]
# ── Async runtime ────────────────────────────────────────────────
# `net` + `io-util` are required by the always-on daemon (UnixListener/UnixStream,
# AsyncReadExt/WriteExt). They were previously only present transitively via `reqwest`
# (a default feature), so `--no-default-features` failed to compile the daemon. Declare
# them explicitly so every feature combo builds.
tokio = { version = "1.50", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "process", "signal", "net", "io-util", "io-std"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["rt", "compat"] }
futures = "0.3"
agent-client-protocol = { version = "=0.10.4", features = ["unstable_session_resume", "unstable_session_close"] }
globset = "0.4"

# ── TUI framework ────────────────────────────────────────────────
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }

clap = { version = "4.5", features = ["derive"] }
clap_complete = "=4.6.5"

# ── Serialization ────────────────────────────────────────────────
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
serde_jcs = { version = "0.2", optional = true }
toml = "0.8"
# Layered config merge (Epic 7 retro AI-7.2 / Path A). Provides field-level
# merge across config layers — required by Epic 8 Story 8.1 AC. The `toml`
# feature loads TOML files; `env` enables RUSTAIN_* env-var layer (Epic 8).
figment = { version = "0.10", features = ["toml", "env", "json"] }

# ── Error handling ───────────────────────────────────────────────
thiserror = "2.0"
anyhow = "1.0"

# ── Logging / tracing ────────────────────────────────────────────
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# ── HTTP client (provider adapters) ─────────────────────────────
reqwest = { version = "0.12", features = ["stream", "json", "rustls-tls"], optional = true }
axum = { version = "0.8", optional = true }
# Story 18.1b — server-side TLS for the non-loopback A2A listener. Direct (not
# via reqwest's `rustls-tls`, which is a *client* config) and `a2a`-gated.
# Pinned to the versions reqwest already resolves so one rustls links.
rustls = { version = "0.23", optional = true }
tokio-rustls = { version = "0.26", optional = true }
rustls-pemfile = { version = "2", optional = true }
# Story 19.14 (`A1`) — named SOLELY to downcast `rustls::CertificateError::Other`
# to `webpki::Error::CaUsedAsEndEntity`, the one anchor sub-cause rustls does not
# give a first-class variant. `rustls` already depends on this exact crate
# (lib name `webpki`); this declaration copies rustls's own form so cargo
# unifies on ONE copy and adds no feature. ⛔ Not zero bytes: a direct
# dependency changes crate-metadata hashes, so the proof is the one-copy
# `cargo tree` line plus the measured release-size delta — never "byte-identical".
rustls-webpki = { version = "0.103", default-features = false, features = [
    "alloc",
], optional = true }
# Constant-time credential comparison (Story 18.1b, R6). A naive `==` over a
# shared secret reachable from a network socket is a timing oracle.
subtle = { version = "2", optional = true }

# ── Encoding ─────────────────────────────────────────────────────
base64 = "0.22"

# ── Utilities ────────────────────────────────────────────────────
async-trait = "0.1"
arc-swap = "1.7"
nanoid = "0.4"
petname = "2.0"
dirs = "6.0"
sha2 = "0.10"
unicode-width = "0.2"
arboard = { version = "3", optional = true }
png = { version = "0.17", optional = true }
pulldown-cmark = "0.13"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
once_cell = "1"
scopeguard = "1"
shell-words = "1"
lru = "0.16.3"
blake3 = "1"
bm25 = { version = "=2.3.2", optional = true }
hex = "0.4"
gray_matter = "0.2"
url = "2"
zeroize = { version = "1", features = ["alloc"] }
ed25519-dalek = { version = "=2.2.0", features = ["pkcs8", "rand_core"] }
# Story 18.4 — replaceable cross-host transport adapter. Exact pin: iroh's
# public vocabulary and MSRV can move within a minor release.
iroh = { version = "=1.0.3", optional = true }
# Story 18.4c-b — the embedded relay SERVER behind `rustain relay serve`
# (FR159). Exact pin, and it must move in LOCKSTEP with `iroh` above: the relay
# server and the relay client have to link the same protocol version.
# `default-features = false` drops the default `metrics`/`tls-ring` pair, but
# `server` re-implies BOTH (`iroh-relay-1.0.3/Cargo.toml`: `server = ["metrics",
# …, "tls-ring"]`) — which AC4 depends on, because `Counter::get()` returns a
# hardcoded 0 with `iroh-metrics/metrics` off and the "ask the relay" leg would
# go silently vacuous.
iroh-relay = { version = "=1.0.3", optional = true, default-features = false, features = [
    "server",
] }
# Story 18.4b (AC2) — QR encoding for `peer invite`. `default-features = false`
# drops the `image`/`svg`/`pic` renderers, leaving a pure-Rust encoder with
# ZERO transitive dependencies; this crate renders the module matrix itself
# because the tree has no block-drawing or canvas capability. NOT optional: the
# `peer` verbs are ungated, so a `--features p2p` gate here would make
# `peer invite` unavailable in a default build.
qrcode = { version = "0.14.1", default-features = false }
# Portable OS CSPRNG for identity key generation (Story 17.1a: replaces the
# Unix-only `/dev/urandom` read). Pinned to 0.6.4 — the exact version already
# resolved transitively via ed25519-dalek's `rand_core` feature — so this only
# makes `rand_core::OsRng` directly importable (no lockfile change). `getrandom`
# (a rand_core default feature) backs `OsRng` on Linux/macOS/Windows/FreeBSD.
rand_core = "0.6.4"
rpassword = "7"

# ── Self-update (Story 13.3a, feature-gated `self-update`) ──────
# Port-based design: SelfUpdatePort (network) + BinaryReplacerPort (filesystem).
# Rejects the `self_update` crate (untestable monolith + 2nd TLS stack).
# `reqwest` is shared with provider features (already optional); `self-replace`
# handles the running-binary swap (Windows locked-exe + same-fs rename);
# `semver` for correct version comparison; `minisign-verify` for Ed25519
# signature verification (verify-only, pure Rust, ED prehash native).
self-replace = { version = "1", optional = true }
semver = { version = "1", optional = true }
minisign-verify = { version = "0.2", optional = true }

# ── Local vector search (Story 11.3a, feature-gated `vector-search`) ──
# Local ONNX embeddings (downloads + caches the model on first use → AC5) and
# the binary `index.bin` codec (architecture.md:576). BOTH optional + kept OUT
# of `default` so NFR9 (<30MB default binary) is untouched and no ONNX runtime
# is pulled unless the feature is compiled in. fastembed transitively pulls
# `ort` (ONNX Runtime), whose `download-binaries` fetches a prebuilt runtime at
# build/first-run → `--features vector-search` requires network (see Dev Notes).
fastembed = { version = "5.14", optional = true }
bincode = { version = "2", optional = true }

# ── Landlock sandbox (Story 9.5, ADR-06-04) ─────────────────────
landlock = { version = "0.4", optional = true }

# ── WASM execution sandbox (Story 17.3a, ADR-17-3a-01, feature-gated `wasm-sandbox`) ──
# Untrusted-guest execution over the wasmtime component model. OUT of `default`
# (NFR9 binary size; no untrusted-tool population exists yet — party ruling N4):
# the port compiles unconditionally (pure domain); only the `WasmIsolationBackend`
# adapter is `#[cfg(feature = "wasm-sandbox")]`. Exact-major pin (wasmtime cuts a
# new major monthly on the 20th — bump deliberately, never `^`). `default-features
# = false` keeps the tree to cranelift + component-model + async runtime.
wasmtime = { version = "46", optional = true, default-features = false, features = ["cranelift", "component-model", "async", "runtime"] }
wasmtime-wasi = { version = "46", optional = true }
wasmtime-wasi-io = { version = "46", optional = true }

# ── Telegram channel adapter (Story 12.3, feature-gated) ──────────
teloxide = { version = "0.17.0", optional = true, default-features = false, features = ["macros", "rustls"] }

# ── Cron scheduler adapter (Story 12.4, feature-gated) ───────────
# Parser only; rustain owns the tokio sleep/select loop.
croner = { version = "3.0.1", optional = true }

# ── Rustycode path deps — uncomment in Story 1.2 ────────────────
# Verify crossterm/ratatui version compatibility with rustycode before enabling
# domain = { path = "../rustycode/domain" }
# adapters = { path = "../rustycode/adapters" }
# llm-provider = { path = "../rustycode/llm-provider", features = ["config"] }

# ── MCP SDK (Epic 9) ─────────────────────────────────────────────
# Story 9.9 (ruling A3 → Option A, resolved at the 2026-08-31 preflight):
# `transport-streamable-http-client-reqwest` brings the Streamable HTTP client
# transport; `reqwest` is the TLS backend and is ⛔ NOT optional. The transport
# feature alone expands to `["transport-streamable-http-client", "__reqwest"]`
# and `__reqwest = ["dep:reqwest"]` — which selects NO TLS provider, so every
# `https://` MCP URL would fail to build a client. TLS lives in rmcp's separate
# `reqwest = ["__reqwest", "reqwest?/rustls"]` key. BOTH STRINGS OR NEITHER.
#
# ⚠ rmcp resolves its own reqwest 0.13 (semver-incompatible with rustain's 0.12
# at :77 — no feature unification, both are in the lock). Measured against the
# SHIPPED feature set (`release.yml:70` = self-update,relay-server,a2a,p2p +
# defaults) this adds exactly ONE crate, `sse-stream`: `reqwest 0.13`,
# `aws-lc-rs`, `rustls-platform-verifier` and `rustls-native-certs` are already
# at release baseline via `iroh → hickory-resolver → hickory-net → rustls`.
rmcp = { version = "1.0", default-features = false, features = [
    "client",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
    "reqwest",
], optional = true }

# Story 9.9 (AC6) — rmcp's Streamable HTTP transport is generic over its HTTP
# client and surfaces failures as `StreamableHttpError<reqwest::Error>` boxed
# behind `DynamicTransportError`. AC6 requires THREE DISTINCT operator-facing
# strings (unreachable / 401 + WWW-Authenticate / 5xx), and recovering the typed
# error means NAMING rmcp's reqwest — which is 0.13, a different crate from
# rustain's own 0.12 at :77. This alias binds rmcp's ALREADY-PRESENT 0.13 under
# a second name so `adapters/mcp/http.rs` can downcast to the real error type.
#
# ⚑ MEASURED, not assumed: `cargo tree -e normal` over the shipped feature set
# (`release.yml:70`) is byte-identical with and without this line — cargo
# unifies it with rmcp's own 0.13 requirement, so it adds ZERO crates. ⛔ Keep
# `default-features = false` and add no features: the tree must stay the union
# rmcp already asked for.
reqwest13 = { package = "reqwest", version = "0.13", default-features = false, optional = true }
# Story 9.9 review: name rmcp's already-selected SSE stream types so the
# guarded HTTP client can delegate GET streams while inspecting raw POST JSON.
# This is the same unified 0.2 crate rmcp brings; it adds zero packages.
sse-stream = { version = "0.2", optional = true }

tempfile = "3.0"

# ── Unix daemon (Story 12.1a) ────────────────────────────────────
# setsid() for detaching the re-exec child from the controlling terminal and
# kill(pid, signal)/kill(pid, 0) liveness probing for the daemon lifecycle.
# Already vendored (was a dev-dep + transitive); promoting to a runtime dep is
# within Story 12.1a scope (Task 2 setsid / Task 5 kill(pid,0)).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio-test = "0.4"
tokio = { version = "1.50", features = ["test-util", "rt", "macros", "time", "sync"] }  # deterministic time (pause/advance) for abandonment timing tests
tempfile = "3.0"
pretty_assertions = "1"
mockito = "1"
serial_test = "3"
async-trait = "0.1"
# Epic 6 scaffolding (sprint-change-proposal-2026-04-24):
# - insta: TUI snapshot testing for widgets (story 6-0d PlanApprovalCard; future widgets)
insta = { version = "1.41", features = ["yaml"] }
libc = "0.2"  # perf-tests/subagent_spawn.rs: sysconf(_SC_PAGESIZE) for RSS-per-agent measurement
wiremock = "0.6"
assert_cmd = "2.0"
predicates = "3"
tracing-test = "0.2"
rand = "0.9"  # deterministic seeded shuffle for stratified eval partition (Story 9-7c)
proptest = "1"  # NN2 property test for synonym collisions (Story 9-7c)
trybuild = "1"  # Story 14.3 AC5: Window<Handle> inlining-mutant compile_fail + pass-twin pair
minisign = "0.7"  # Story 13.3a: test-signing fixtures with ephemeral keys (NOT shipped in binary)
parking_lot = "0.12"  # Story 17.4b: scripted A2A transport mocks (rs-parking-lot rule)

# Story 18.1b — self-signed certificates for the non-loopback TLS keystone.
# Dev-only: the production TLS path loads operator-supplied PEM files, and a
# TLS test that never completes a handshake proves nothing.
rcgen = "0.14"

[target.'cfg(target_os = "linux")'.dev-dependencies]
procfs = "0.17"

[features]
default = ["anthropic", "openai", "ollama", "clipboard", "mcp", "meta-search", "models-dev"]
anthropic = ["dep:reqwest"]
clipboard = ["dep:arboard", "dep:png"]
# openai feature transitively enables anthropic because OpenAiAdapter reuses
# SseLineBuffer from crate::adapters::anthropic::sse (Story 7.1b).
openai = ["anthropic", "dep:reqwest"]
ollama = ["dep:reqwest"]
# models.dev live pricing catalog fetch. reqwest is the HTTP client; the
# resolver + disk-cache logic compile unconditionally (pure serde/fs).
models-dev = ["dep:reqwest"]
# Story 9.9: `reqwest13` is rmcp's own reqwest 0.13 under a second name, needed
# to name `StreamableHttpError<reqwest::Error>` when classifying HTTP failures
# (AC6). Adds zero crates — see the dependency comment.
mcp = ["dep:rmcp", "dep:reqwest13", "dep:sse-stream"]
test-fake-mcp = ["mcp", "rmcp/server"]
# DF-17-4a-6: composite_toolset_adapter remains MCP-gated across its lifecycle surface.
a2a = [
    "mcp",
    "dep:reqwest",
    "dep:serde_jcs",
    "dep:axum",
    "dep:rustls",
    "dep:tokio-rustls",
    "dep:rustls-pemfile",
    "dep:rustls-webpki",
    "dep:subtle",
]
# Story 18.4 — cross-host peer transport. Kept independent from the A2A HTTP
# surface and out of default; domain types compile without the adapter.
p2p = ["dep:iroh"]
# Story 18.4c — the hermetic relay fixture, for `tests/conformance_p2p_relay.rs`
# only. A SEPARATE key on purpose: `p2p` stays exactly `["dep:iroh"]`, which a
# conformance test asserts by set equality, and `iroh/test-utils` transitively
# pulls `iroh-relay/server` + `axum`.
#
# ⚑ AMENDED 2026-08-17 by Story 18.4c-b (ruling A2). This comment used to end
# *"— a server tree that must never reach the shipped binary"*. That sentence
# was true of THIS key and is now false by scope change: `relay-server` below
# ships the same server tree deliberately, because `relay serve` IS the
# product's relay. The corrected statement is narrower and still load-bearing:
# ⛔ the **test-utils** tree (`iroh/test-utils` + `axum`) must never reach the
# shipped binary, and nothing here may widen `p2p`.
p2p-test-utils = ["p2p", "iroh/test-utils"]
# Story 18.4c-b — the embedded relay server for `rustain relay serve` (FR159).
# A SEPARATE key, exactly like `p2p-test-utils` above: `p2p` stays exactly
# `["dep:iroh"]` (asserted by set equality), and a NEW key is invisible to that
# assertion. Off by default — the server tree is ~15 crates and NFR53 bounds a
# feature at 5 MB.
#
# ⚠ FOUR dependencies, not one. `rustls`/`rustls-pemfile` are needed to NAME
# `rustls::ServerConfig` for `CertConfig::Manual` and to parse the operator's
# PEMs; both already exist as optional deps behind `a2a`, pinned to the versions
# reqwest resolves so ONE rustls links. Reusing them widens no other feature
# array.
relay-server = ["dep:iroh-relay", "dep:rustls", "dep:rustls-pemfile"]
skills-validation = []
meta-search = ["dep:bm25"]
sandbox = ["dep:landlock"]
# Story 17.3a — WASM execution sandbox (FR146). OFF by default (see the wasmtime
# dep comment). The port + domain value types compile without it; enabling this
# pulls in the wasmtime runtime and builds the `WasmIsolationBackend` adapter.
wasm-sandbox = ["dep:wasmtime", "dep:wasmtime-wasi", "dep:wasmtime-wasi-io"]
# Test-only instrumentation for P0-2/P0-3 sentinels (Story 13.2a review patch).
# Off by default; enabled for integration tests via `--features test-instrumentation`.
test-instrumentation = []
telegram = ["dep:teloxide"]
cron = ["dep:croner"]
# Story 11.3a — local semantic memory search. OUT of `default` (NFR9): the
# embedding model is downloaded on first use, not bundled, and `ort` needs
# network at build time. `cargo build|test --features vector-search` to enable.
#
# Story 11.3b extends the SAME feature (proposal 2026-05-30 Change 3 — "no new
# cargo feature beyond `vector-search`"): `reqwest` is the remote OpenAI-compatible
# `/embeddings` HTTP client (RemoteEmbeddingProvider, AC1) and `bm25` is the
# keyword scorer for hybrid retrieval (AC2). Both already live in the tree
# (`reqwest` is pulled by the default provider features; `bm25` is also behind
# `meta-search`); listing them here makes `--features vector-search` self-
# sufficient even when those features are off (Cargo features are additive).
vector-search = ["dep:fastembed", "dep:bincode", "dep:reqwest", "dep:bm25"]
# Story 13.3a — self-update with cryptographic signature verification. OUT of
# `default` (not all platforms have release assets yet; AC9 hard-errors). Reuses
# `reqwest` for GitHub API + binary download; `self-replace` for atomic binary
# swap; `semver` for correct version comparison; `minisign-verify` for Ed25519
# signature verification (verify-only, pure-Rust, ED prehash native).
self-update = ["dep:reqwest", "dep:self-replace", "dep:semver", "dep:minisign-verify"]

# Package-wide lint posture (Epic 12 retro AI-12.1). Unlike the `#![allow]` block in
# src/lib.rs + src/main.rs (which only covers lib + bin), Cargo `[lints]` applies to
# EVERY target — integration tests, build.rs, examples. `collapsible_if`/`else_if` are
# already an accepted project-wide allow (see the lib.rs "flatten nested ifs" TODO);
# bumping MSRV to 1.91 unlocked let-chains, so clippy now also suggests collapsing
# nested `if let`s inside the test crates. Keep them allowed here so the `-D warnings`
# gate stays meaningful without hand-flattening test scaffolding.
[lints.clippy]
collapsible_if = "allow"
collapsible_else_if = "allow"

[profile.release]
opt-level =  3 #"z"
lto = true
strip = true
codegen-units = 1
panic = "abort"
