[package]
name = "rustain"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A fast, extensible, terminal-native AI coding agent"
license = "MIT"
readme = "README.md"

[lib]
name = "rustain"
path = "src/lib.rs"

[[bin]]
name = "rustain"
path = "src/main.rs"

[[bin]]
name = "fake-mcp-server"
path = "tests/common/fake_mcp_server.rs"
test = true
bench = false
required-features = ["mcp"]

[dependencies]
# ── Async runtime ────────────────────────────────────────────────
tokio = { version = "1.50", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "process", "signal"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["rt"] }
futures = "0.3"
globset = "0.4"

# ── TUI framework ────────────────────────────────────────────────
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }

# ── CLI parsing ──────────────────────────────────────────────────
clap = { version = "4.5", features = ["derive"] }

# ── Serialization ────────────────────────────────────────────────
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
# Layered config merge (Epic 7 retro AI-7.2 / Path A). Provides field-level
# merge across config layers — required by Epic 8 Story 8.1 AC. The `toml`
# feature loads TOML files; `env` enables RUSTAIN_* env-var layer (Epic 8).
figment = { version = "0.10", features = ["toml", "env", "json"] }

# ── Error handling ───────────────────────────────────────────────
thiserror = "2.0"
anyhow = "1.0"

# ── Logging / tracing ───────────────────────────────────────────
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# ── HTTP client (provider adapters) ─────────────────────────────
reqwest = { version = "0.12", features = ["stream", "json", "rustls-tls"], optional = true }

# ── Encoding ─────────────────────────────────────────────────────
base64 = "0.22"

# ── Utilities ────────────────────────────────────────────────────
async-trait = "0.1"
arc-swap = "1.7"
nanoid = "0.4"
petname = "2.0"
dirs = "6.0"
sha2 = "0.10"
unicode-width = "0.2"
arboard = { version = "3", optional = true }
png = { version = "0.17", optional = true }
pulldown-cmark = "0.13"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
once_cell = "1"
scopeguard = "1"
shell-words = "1"
lru = "0.12"
blake3 = "1"
hex = "0.4"
gray_matter = "0.2"

# ── Landlock sandbox (Story 9.5, ADR-06-04) ─────────────────────
landlock = { version = "0.4", optional = true }

# ── Rustycode path deps — uncomment in Story 1.2 ────────────────
# Verify crossterm/ratatui version compatibility with rustycode before enabling
# domain = { path = "../rustycode/domain" }
# adapters = { path = "../rustycode/adapters" }
# llm-provider = { path = "../rustycode/llm-provider", features = ["config"] }

# ── MCP SDK (Epic 9) ─────────────────────────────────────────────
rmcp = { version = "1.0", default-features = false, features = ["client", "transport-child-process"], optional = true }

tempfile = "3.0"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.0"
pretty_assertions = "1"
mockito = "1"
serial_test = "3"
async-trait = "0.1"
# Epic 6 scaffolding (sprint-change-proposal-2026-04-24):
# - insta: TUI snapshot testing for widgets (story 6-0d PlanApprovalCard; future widgets)
insta = { version = "1.41", features = ["yaml"] }
procfs = "0.17"
wiremock = "0.6"
assert_cmd = "2.0"
predicates = "3"
tracing-test = "0.2"

[features]
default = ["anthropic", "clipboard", "mcp"]
anthropic = ["dep:reqwest"]
clipboard = ["dep:arboard", "dep:png"]
# openai feature transitively enables anthropic because OpenAiAdapter reuses
# SseLineBuffer from crate::adapters::anthropic::sse (Story 7.1b).
openai = ["anthropic", "dep:reqwest"]
ollama = ["dep:reqwest"]
mcp = ["dep:rmcp"]
skills-validation = []
sandbox = ["dep:landlock"]

[profile.release]
opt-level =  3 #"z"
lto = true
strip = true
codegen-units = 1
panic = "abort"
