[project]
name = "rustain-harbor"
version = "0.1.0"
description = "Harbor agent adapter that runs `rustain ask` inside task containers"
requires-python = ">=3.12"
dependencies = [
    "harbor>=0.25,<0.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rustain_harbor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
