[project]
name = "rustain-tui-tests"
version = "0.1.0"
description = "Pexpect-based E2E TUI tests for rustain"
requires-python = ">=3.10"
dependencies = [
    "pytest>=8.0",
    "pexpect>=4.9",
    "pyte>=0.8,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest-timeout>=2.2",
    "pytest-xdist>=3.5",
    "pytest-rerunfailures>=14.0",
]

# tests_tui is a test directory, not a library. `pip install -e "./tests_tui[dev]"`
# (ci.yml, README) exists only to install the dependencies above, so package
# discovery is off — with `fixtures/` and `journeys/` beside the test modules,
# setuptools' flat-layout discovery refuses to build at all.
[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    # Lane markers: added by tests_tui/lane_guard.py from tests_tui/lanes.json, never written in a test file.
    "core: per-push lane: the regression stoppers, no capability build (CI: -m core)",
    "governance: receipt and conflict-manifest controls (nightly-proofs.yml: -m 'governance and not a2a_binary')",
    "native_nightly: native or capability-build tests kept out of the per-push lane (nightly-tui.yml and the parity leg run the debug ones)",
    "manual: never selected by a lane; the table names the owner row",
    "requires_api: API lane: test requires a live API key and network access (no lane marker, not in lanes.json)",
    "mcp: Tests that exercise MCP (stdio) integration via the fixture server",
    "subagent: Tests that exercise in-process subagent spawning / the task tool",
    "a2a_binary: test requires an explicitly built binary with the a2a feature",
    "p2p_binary: test requires an explicitly built binary with the p2p feature",
    # Kept only because hash-bound capture drivers use them and cannot be edited (tui-7 owns them).
    "story_19_19: Story 19-19 — executing consultation and ADR fan-out capture",
    "story_19_21: Story 19.21 — attached Act 1 distribution capture",
]
# Lanes (see README "Lanes"). CI per push:
#   pytest tests_tui/ -m core -n auto --timeout=120
# nightly-proofs.yml (with the 29 receipt policy controls):
#   pytest tests_tui/ -m "governance and not a2a_binary" --ignore=tests_tui/test_receipt_controls.py -n auto --timeout=120
# nightly-tui.yml and the parity leg:
#   pytest tests_tui/ -m "native_nightly and not a2a_binary and not p2p_binary" -n auto --timeout=300
# API lane: pytest tests_tui/ -m requires_api (needs a key; skipped without one).
timeout = 180
# A red test is red: no retries (a retry needs a reviewed change here). Local --reruns=N stays available.
reruns = 0
addopts = "--dist loadgroup --strict-markers"
filterwarnings = [
    # pexpect.spawn uses pty.forkpty() in a multi-threaded parent (pytest-xdist).
    # This is a known limitation of the PTY-based test harness; the warning
    # adds no actionable signal and spams every test run.
    "ignore::DeprecationWarning:pty.*:95",
]
