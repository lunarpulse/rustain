name = "personal-assistant"
description = "Personal-life assistant (preview). Daily-log memory. Telegram and cron run under 'rustain daemon start' with your own profile (docs/daemon.md)."
extends = "base"
preview = true

[persona]
adapter = "personal-assistant"

[memory]
adapter = "daily-log"

[channels]
adapter = "telegram"

[scheduler]
adapter = "cron"

[context]
adapter = "daily"
